# Redistribution allowlist used by the resolver.
#
# Bundling a mod or plugin in a public server image is redistribution. An
# artifact whose license is missing, a LicenseRef-* value (including
# "All Rights Reserved"), or any identifier not listed under `allowed`, is
# recorded as `unavailable` in the lock unless a `permissions` entry records
# the author's permission. SPDX expressions are evaluated: `A OR B` needs one
# allowed id, `A AND B` needs all, `WITH <exception>` is ignored, a trailing
# `+` is stripped.
#
# permissions: author-granted exceptions.
#   - provider: modrinth | curseforge | custom   ("custom" covers prebuilt and custom_build entries)
#     project:  slug or project ID (for custom entries: the manifest id)
#     note:     where/when the permission was granted
