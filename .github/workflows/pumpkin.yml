# pumpkin image pipeline; the stages live in the reusable server-image.yml.
name: pumpkin

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish every target even if its inputs are unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/mc-server-images/pumpkin/**"
      - "src/mc-server-images/common/**"
      - "src/mc-server-images/licenses.yml"
      - ".github/scripts/server_images/**"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/pumpkin.yml"
      - ".github/workflows/server-image.yml"
      - ".python-version"
  pull_request:
    paths:
      - "src/mc-server-images/pumpkin/**"
      - "src/mc-server-images/common/**"
      - "src/mc-server-images/licenses.yml"
      - ".github/scripts/server_images/**"
      - ".github/scripts/requirements.txt"
      - ".github/workflows/pumpkin.yml"
      - ".github/workflows/server-image.yml"
      - ".python-version"

concurrency:
  group: pumpkin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/server-image.yml
    with:
      server: pumpkin
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
