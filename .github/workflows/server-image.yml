# Reusable server image pipeline, called by fabric.yml, neoforge.yml, paper.yml and pumpkin.yml.
# Stages (each uses a job matrix):
#   plan        resolve the three newest stable Minecraft releases this server has a stable build for,
#               plus newer unsupported releases as pending (`plan`; the window is per server),
#               upload the plan + draft locks, emit the dynamic build matrix.
#   build       one job per Minecraft version whose inputs changed (none when nothing changed): build custom artifacts, finalize the lock,
#               stage the Docker context, build the image, run the CI checks, upload the image,
#               lock and results as the artifact build-<server>-<minecraft>. Never pushes to a registry.
#   push_image  main only: `publish` pushes the tested image bytes to the registry, moves
#               `latest`, deletes locks of versions that left the window, and commits the locks
#               and status.json directly to main. Runs even when no build job was needed.
# The tooling is the server_images package in .github/scripts (python -m server_images <command>).
# Callers must grant `contents: write` and `packages: write` (push_image needs them).
name: server-image

on:
  workflow_call:
    inputs:
      server:
        description: Server name (fabric, neoforge, paper, pumpkin)
        type: string
        required: true
      force:
        description: Rebuild and republish every target even if its inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/.github/scripts

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Plan the maintained Minecraft versions
        id: plan
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -m server_images plan \
            --server "${{ inputs.server }}" \
            --out "plan/${{ inputs.server }}" \
            --github-output \
            "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: plan-${{ inputs.server }}
          path: plan/${{ inputs.server }}
          retention-days: 3
          if-no-files-found: error

  # Only targets whose inputs changed get a job; unchanged and pending ones are
  # handled by push_image straight from plan.json.
  build:
    name: build ${{ matrix.minecraft }}
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: local/minecraft-server-${{ inputs.server }}:${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: plan-${{ inputs.server }}
          path: plan/${{ inputs.server }}

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Build custom source artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m server_images build-custom \
            --server "${{ inputs.server }}" \
            --minecraft "${{ matrix.minecraft }}" \
            --plan plan/${{ inputs.server }} \
            --out custom

      - name: Finalize lock
        run: |
          mkdir -p out
          python -m server_images lock \
            --server "${{ inputs.server }}" \
            --minecraft "${{ matrix.minecraft }}" \
            --plan plan/${{ inputs.server }} \
            --custom custom \
            --out out/lock.json

      - name: Stage Docker build context
        run: |
          python -m server_images stage \
            --server "${{ inputs.server }}" \
            --lock out/lock.json \
            --custom custom \
            --out ctx

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build image
        run: |
          args=()
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            args+=(--build-arg "$line")
          done < ctx/build-args.env
          docker build \
            "${args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ matrix.minecraft }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "io.github.hambn.minecraft.server=${{ inputs.server }}" \
            --tag "$IMAGE" \
            ctx

      # A failing check is recorded in result.json; the job fails after the artifact is uploaded.
      - name: Run CI checks
        id: checks
        run: |
          mkdir -p out
          if python -m server_images.ci_check \
              --image "$IMAGE" \
              --catalog ctx/catalog/catalog.tsv \
              --out out/checks.json; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export image and results
        env:
          PASSED: ${{ steps.checks.outputs.passed }}
        run: |
          if [ "$PASSED" = "true" ]; then
            docker save -o out/image.tar "$IMAGE"
          fi
          cp -r custom out/custom
          python -m server_images result \
            --server "${{ inputs.server }}" \
            --minecraft "${{ matrix.minecraft }}" \
            --lock out/lock.json \
            --passed "$PASSED" \
            --out out/result.json

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.server }}-${{ matrix.minecraft }}
          path: out
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Fail when CI checks failed
        if: steps.checks.outputs.passed != 'true'
        run: |
          echo "::error::CI checks failed for ${{ inputs.server }} ${{ matrix.minecraft }}; nothing will be published"
          exit 1

  push_image:
    needs: [plan, build]
    # Also runs when no build job was needed (build skipped): status, pending
    # targets and removal of locks that left the window still get committed.
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        registry: [ghcr]
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-${{ inputs.server }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.LOCKS_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: plan-${{ inputs.server }}
          path: plan/${{ inputs.server }}

      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.has_builds == 'true'
        with:
          pattern: build-${{ inputs.server }}-*
          path: artifacts

      - name: Select registry
        id: registry
        env:
          REGISTRY: ${{ matrix.registry }}
          OWNER: ${{ github.repository_owner }}
        run: |
          case "$REGISTRY" in
            ghcr) host=ghcr.io ;;
            *) echo "::error::unknown registry $REGISTRY"; exit 1 ;;
          esac
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "namespace=$host/${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          REGISTRY: ${{ matrix.registry }}
          HOST: ${{ steps.registry.outputs.host }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$REGISTRY" in
            ghcr) skopeo login "$HOST" -u "${{ github.actor }}" --password-stdin <<< "$GITHUB_TOKEN" ;;
          esac

      - name: Publish images, locks and status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m server_images publish \
            --server "${{ inputs.server }}" \
            --artifacts artifacts \
            --plan "plan/${{ inputs.server }}" \
            --registry "${{ steps.registry.outputs.namespace }}"
