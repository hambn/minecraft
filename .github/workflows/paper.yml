# paper image pipeline; the stages live in the reusable server-image.yml.
name: paper

on:
  schedule:
    - cron: "27 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish every target even if its inputs are unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/mc-server-images/paper/**"
      - "src/mc-server-images/common/**"
      - "src/mc-server-images/*.py"
      - "src/mc-server-images/sources/**"
      - "src/mc-server-images/licenses.yml"
      - "src/mc-server-images/requirements.txt"
      - ".github/workflows/paper.yml"
      - ".github/workflows/server-image.yml"
      - ".python-version"
  pull_request:
    paths:
      - "src/mc-server-images/paper/**"
      - "src/mc-server-images/common/**"
      - "src/mc-server-images/*.py"
      - "src/mc-server-images/sources/**"
      - "src/mc-server-images/licenses.yml"
      - "src/mc-server-images/requirements.txt"
      - ".github/workflows/paper.yml"
      - ".github/workflows/server-image.yml"
      - ".python-version"

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/server-image.yml
    with:
      server: paper
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
